repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --project backend ruff check --config backend/pyproject.toml
        language: system
        files: ^backend/.*\.py$
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run --project backend ruff format --config backend/pyproject.toml
        language: system
        files: ^backend/.*\.py$
        types: [python]
